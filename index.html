<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#171716">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sonidos">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=logo-20260921">
  <link rel="icon" href="./icons/icon-192.png?v=logo-20260921">
  <link rel="stylesheet" href="./styles.css">
  <title>Caceta de Golira · Sonidos 2025</title>
</head>
<body>
<div class="app">
  <header class="header" data-app-header>
    <a class="brand" href="./" aria-label="Caceta de Golira home"><img class="brand-logo" src="./branding/caceta-de-golira.webp" width="588" height="336" alt="Caceta de Golira"><span>Sonidos 2025</span></a>
    <nav class="mode-nav" aria-label="Media type">
      <button data-mode="videos" aria-pressed="true">Videos</button>
      <button data-mode="audio" aria-pressed="false">Audio</button>
    </nav>
    <button class="install quiet" id="install" hidden>Install</button>
  </header>
  <main class="scroll" id="main">
    <div class="content">
      <div id="install-help" class="notice" hidden><span>Share → Add to Home Screen</span><button class="quiet" id="dismiss-install" aria-label="Dismiss install hint">Close</button></div>
      <section id="video-player" class="video-player" aria-label="Video player" hidden>
        <div class="player-head"><h1 id="video-title"></h1><button class="quiet" id="close-video">Close</button></div>
        <div class="video-stage"><video id="video" controls playsinline preload="none"></video><iframe id="youtube" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen hidden></iframe></div>
        <a id="youtube-link" class="text-link" target="_blank" rel="noopener" hidden>Open on YouTube</a>
      </section>
      <section id="videos-view" aria-label="Videos">
        <div class="library-toolbar">
          <div class="filters" aria-label="Video category"><button data-category="songs" aria-pressed="true">Songs</button><button data-category="full" aria-pressed="false">Full set</button></div>
          <span class="count" id="video-count"></span>
        </div>
        <div id="video-grid" class="video-grid"></div>
      </section>
      <section id="audio-view" aria-label="Audio" hidden>
        <div class="library-toolbar"><div class="filters" aria-label="Audio filter"><button data-audio-filter="all" aria-pressed="true">All songs</button><button data-audio-filter="saved" aria-pressed="false">Saved offline</button></div><button class="quiet" id="play-all">Play all</button></div>
        <div id="audio-list" class="audio-list"></div>
        <p id="audio-empty" class="empty" hidden>No saved songs.</p>
      </section>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </div>
  </main>
  <footer id="audio-dock" class="audio-dock" data-app-nav hidden>
    <div class="playing-track"><span class="now-label">Playing</span><strong id="audio-title"></strong></div>
    <audio id="audio" controls preload="none"></audio>
    <div class="transport"><button id="previous" class="quiet" aria-label="Previous song">Previous</button><button id="next" class="quiet" aria-label="Next song">Next</button><button id="close-audio" class="quiet" aria-label="Close audio player">Close</button></div>
  </footer>
</div>
<script src="./catalog.js"></script>
<script src="./app.js"></script>
</body>
</html>
