<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171716">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sonidos">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=logo-20260921">
  <link rel="icon" href="../icons/icon-192.png?v=logo-20260921">
  <link rel="stylesheet" href="../installer.css">
  <script src="../installer.js"></script>
  <title>Install Sonidos app</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #171716; color: #f5f3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px; }
    main { text-align: center; max-width: 340px; }
    .install-button { display: inline-block; text-decoration: none; border: 0; border-radius: 14px; background: #f5f3ee; color: #171716; padding: 19px 27px; font: inherit; font-size: 18px; font-weight: 650; cursor: pointer; min-height: 60px; touch-action: manipulation; }
    .install-button:focus-visible { outline: 3px solid #efad72; outline-offset: 5px; }
    .install-button:disabled { opacity: .7; cursor: wait; }
    p { margin: 24px 0 0; font-size: 15px; line-height: 1.65; color: #ccc9c0; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <button id="install" class="install-button" type="button" data-sonidos-install="landing">Install Sonidos app</button>
  </main>
</body>
</html>
