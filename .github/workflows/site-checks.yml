name: Site checks
on: [push, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Preview
        run: |
          mkdir -p /tmp/sonidos-preview/sonidos-2025
          cp -R index.html styles.css app.js catalog.js data.json manifest.webmanifest sw.js icons thumbs /tmp/sonidos-preview/sonidos-2025/
          python3 -m http.server 3011 --directory /tmp/sonidos-preview > /tmp/sonidos-preview.log 2>&1 &
      - run: node tools/audit-pwa.mjs http://127.0.0.1:3011/sonidos-2025/
      - run: node tools/audit-mobile.mjs http://127.0.0.1:3011/sonidos-2025
      - run: node tools/test-media.mjs http://127.0.0.1:3011/sonidos-2025/
