server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /sonidos-2025 {
        return 308 /sonidos-2025/;
    }
    location = /sonidos-2025/sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/sonidos-2025/" always;
    }
    location = /sonidos-2025/manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/sonidos-2025/(index\.html|catalog\.js|data\.json)$ {
        add_header Cache-Control "no-cache" always;
    }
    location /sonidos-2025/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
